# method params for yolo_sam_v1

# method identifier — used by run_mask_generation.py's dispatch registry to pick the detector
name: yolo_sam_v1

# model weight files (must be placed in src/mask_generation/weights/)
wheat_yolo_model: "wheat_head_detection_model.pt"  # YOLO model trained on wheat head detection
sam_checkpoint: "sam_vit_h_4b8939.pth"             # SAM ViT-H checkpoint (~2.4 GB)

# --- SAM backend switch (SAM1 vs SAM2 vs SAM3 A/B) ---
# which segmenter turns the YOLO boxes into masks. Box prompts + image + eval are held fixed, so
# the versions compare fairly. NO dependency change: SAM2/SAM3 ship inside our installed ultralytics.
#   sam1 (default) = original ViT-H SamPredictor (uses sam_checkpoint above)
#   sam2           = Meta SAM2 via ultralytics; weight auto-downloads on first use
#   sam3           = Meta SAM3 via ultralytics; weight is GATED (request access on HF facebook/sam3,
#                    download sam3.pt into src/mask_generation/weights/)
sam_backend: sam1
sam_sam2_weight: "sam2.1_l.pt"   # ultralytics SAM2.1-large (best quality; fits 16 GB)
sam_sam3_weight: "sam3.pt"       # ultralytics SAM3 checkpoint (gated; place in weights/ once approved)

# SAM2/SAM3 VRAM control (ultralytics path only). Default all-at-once decode upsamples EVERY box's
# full-res mask together → ~23 GB on ~300 heads (spills/OOMs on 16 GB). Set >0 to instead ENCODE the
# image once and decode boxes in batches of this many → bounds VRAM to encoder + one batch.
#   0  = the original all-at-once path (NOT the default here)
#   16 = the default shipped below, VRAM-safe on a 16 GB card
#   32 = also fits 16 GB (encoder ~5 GB → total ~7 GB) and is a little faster
# NOTE: does NOT rescue SAM3 (its encoder alone is ~26 GB — needs a >=40 GB GPU or lower imgsz).
sam_ul_decode_batch: 16
sam1_decode_batch: 1        # SAM1 boxes decoded per call (1=one-at-a-time, VRAM-safe; >1=faster, more VRAM)
sam_ul_chunk_on_oom: 64          # box-chunk size for the all-at-once path's hard-OOM fallback

# floor confidence applied during NMS — all boxes above this survive NMS and are passed to SAM
# set low (0.01) for metrics to capture the full confidence range for AP/PR curve
conf_threshold_nms_floor: 0.2

# boxes below this confidence are rejected after NMS (shown as red boxes in yolo_vis/)
conf_threshold_good_box: 0.35

# NMS IoU threshold — boxes overlapping more than this with a higher-confidence box are suppressed
iou_threshold_nms: 0.45

# YOLO class IDs to keep — 0 = wheat head (only class in this model)
classes_to_detect: [0]

# resize algorithm for letterboxing images to target_image_size before YOLO inference
# options: LANCZOS (best quality), BICUBIC, BILINEAR, NEAREST (fastest)
resize_method: "LANCZOS"

# images are letterboxed to this size before YOLO inference
target_image_size: 1280

# number of images per GPU batch — lower if GPU OOM
batch_size_yolo: 25

# images loaded into RAM at once before batching — lower if RAM is limited
ram_chunk_size_yolo: 100

# max CPU threads for parallel image loading and saving
max_threads: 10

# show confidence score text next to each drawn box in yolo_vis/
show_labels: true

# draw boxes below conf_threshold_good_box in red in yolo_vis/ (rejected boxes)
show_rejected_boxes: true

# draw boxes above conf_threshold_good_box in blue in yolo_vis/ (accepted boxes)
show_detected_boxes: true

# line thickness in pixels for drawn boxes
box_thickness: 2

# font size multiplier for confidence score labels
label_font_scale: 1

# save a DEBUG_RESIZED.jpg to verify letterbox output looks correct (first image only)
debug_yolo_resize: false

# print per-plot timing report after YOLO phase completes
show_time_yolo: true

# print per-image timing during SAM phase
show_time_sam: true

# print full pipeline summary at the end
show_time_total: true

# true = skip SAM entirely, only run YOLO detection (used for metrics — SAM not needed there)
only_yolo: false

# --- shared SAM granularity (read by src/mask_generation/sam_v1/sam_v1_pipelined.py) ---
# how much of the frame SAM ENCODES per head → the head's resolution at SAM's fixed ~1024 encode.
sam_crop_mode: full_frame   # full_frame (default, unchanged) | per_tile | per_head
sam_tile_size: 1280         # per_tile: encode-crop size (heads at ~tile res)
sam_tile_overlap: 0.2       # per_tile: tile step overlap
sam_tile_pad_frac: 0.02     # per_tile: extra pad around each tile crop
sam_head_margin_frac: 0.4   # per_head: crop pad as a fraction of the box's longer side
sam_head_min_pad: 16        # per_head: minimum crop pad (px)
