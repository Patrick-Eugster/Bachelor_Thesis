# @package _global_
defaults:
  # per-dataset best-config bundle: profile=phone (default) | profile=fip. Each profile composes its
  # dataset + the yolo_sam_v1 detector and sets the thesis-best per-dataset mask-gen values.
  # To use a different detector, override the composed method: profile=phone method=sahi_yolo_sam
  - profile: phone
  - override /hydra/job_logging: disabled    # don't create a .log file in CWD — we print()
  - override /hydra/hydra_logging: disabled
  - _self_

# name for the detection output folder — "thesis_baseline" is the shared end-to-end name threaded
# through mask-gen → recon → seg so the 3D-seg step finds these masks. Leave empty ("") for an auto
# timestamp "2025-04-28_1430"; "initial" is a scratch name that overwrites silently.
experiment_name: "thesis_baseline"

# set true to prepend today's date to experiment_name: "2025-04-28_my_run" (ignored for "initial" or "")
prepend_date: false

# process only the first N plot folders — 0 = no limit (process all)
limit_plots: 0

# process only the first N images per plot — 0 = no limit (process all)
limit_images: 0

# true = only process images that have a manual_label/*.txt file (used for metrics evaluation)
only_labeled_images: false

# only_sam: skip the detector and run ONLY the SAM phase on the bboxes/*.pt already in the
# experiment folder (e.g. to mask an existing surgical/other box run). Pair with the method +
# experiment_name whose bboxes/ you want to segment.
only_sam: false

# true = also write bboxes_with_conf/*.pt (5 cols: x1,y1,x2,y2,conf) for ALL images, even without
# manual labels. Lets you build a confidence histogram on phone data (which has no GT). Pair it with a
# LOW conf threshold (method.conf_threshold_nms_floor / method.conf_threshold_good_box) to capture the
# full sub-threshold distribution for tuning. Off by default → no change to normal runs.
save_bboxes_conf: false

# save_masks: write one binary mask PNG per head in the SAM phase (the default, needed for the
# 3D segmentation). Set false to SKIP the per-head PNG writes and produce only the sam_vis overlay
# + counts — much faster + far less RAM (per-head full-res PNGs are ~97% of phone SAM time). Use it
# for quick visual A/Bs (e.g. ROI-crop on vs off) where you only want to eyeball the masks.
save_masks: true

# save_union_mask: write ONE binary foreground union PNG per image (<stem>_union.png) instead of the
# thousands of per-head PNGs — enough for the SAM-backend A/B (binary IoU vs GT via score_sam_masks.py)
# and avoids the page-cache RAM balloon from writing ~8k full-res masks per backend. Independent of
# save_masks. Default off (normal runs still write per-head masks for the 3D pipeline).
save_union_mask: false

# log SAM progress to wandb.ai dashboard (requires wandb login first)
wandb_enabled: false

# Region-of-interest masking — restrict YOLO/SAHI/SAM to the plot area bounded by the
# ground markers, so the bad image corners (distortion, blur, neighbour-plot heads) are
# ignored. PHONE feature. DEFAULT ON (2026-07-24, user pref): phone builds + filters the
# marker polygon; FIP has no phone markers → the all-markers gate fails → auto-falls-back to
# `fallback: none` → ROI disabled for the plot → byte-identical FIP output (just a WARN line).
# Set roi.enabled=false to force it off. See src/mask_generation/roi_mask.py. Eyeball before a run:
#   python src/mask_generation/roi_mask.py input_plots/phone/field_A/20250715 --buffer_px 80
roi:
  enabled: true            # master switch — DEFAULT ON (phone uses it; FIP auto-falls-back to no-op)
  source: markers          # markers = convex hull of the projected 3D markers (logs/marker_points3d.json)
  fallback: none           # when <min_markers projected (e.g. FIP): none | circle | square
  min_markers: 3           # need at least this many projected markers to form a polygon
  # soft border: grow the MASK polygon outward so boundary heads aren't cut.
  # buffer_frac (fraction of the image SHORT side) scales with resolution and TAKES PRECEDENCE;
  # e.g. 0.05 * 3024px = ~151 px on the phone images. buffer_px is an absolute override (used
  # only when buffer_frac <= 0). The box post-filter always uses the un-buffered polygon.
  buffer_frac: 0.05        # ≈151 px on 4032x3024 — set 0 to use buffer_px instead
  buffer_px: 120           # absolute fallback (px) when buffer_frac <= 0
  fill: [114, 114, 114]    # grey-out value outside the ROI (= YOLO's letterbox pad → treated as padding)
  filter_boxes: true       # post-filter boxes that fall outside the plot
  filter_mode: overlap     # overlap = drop only boxes COMPLETELY outside the (un-buffered) polygon;
                           # center  = drop boxes whose centre is outside
  filter_tol_px: 0         # soften the filter boundary by N px (keep boxes within tol of the polygon)
  # ROI-crop ("ROI-zoom"): crop the frame to the buffered ROI bbox BEFORE inference so the plot
  # fills imgsz → bigger heads (~1.4-2x effective resolution) + smaller input tensor (less VRAM).
  # Boxes/masks are offset back to full-image px afterwards, so downstream (SAM, eval) is unchanged.
  # OFF by default (byte-identical). Phone-only (needs a marker polygon; FIP has none → no-op).
  crop_before_inference: false
  crop_top_margin_frac: 0.10  # extra UPWARD extension (frac of short side) — the marker polygon is
                              # ground-plane, so tall side-view heads sit above it; this keeps them in
  crop_pad_frac: 0.0          # extra symmetric padding (frac of short side) around the buffered bbox
  fallback_circle_frac: 0.9   # circle radius as frac of min(w,h)/2 (fallback=circle)
  fallback_square_frac: 0.9   # kept fraction per side (fallback=square)

# hydra: don't create outputs/ folder
hydra:
  output_subdir: null
  run:
    dir: .
