# segmentation params for run_3d_seg.py

# output subfolder name inside segmentation_3d/ — change to re-run without overwriting previous results
# e.g. exp_name=run_2 → results/.../segmentation_3d/run_2/
exp_name: "thesis_baseline"

# cross-view match acceptance threshold in find_match (segmentation IoU between the rendered blob and the
# best-overlapping SAM mask). 0.6 = our thesis default (stricter, matches the Wheat3DGS authors' README).
# Higher = stricter matching = fewer/looser matches accepted = less over-merging. Set 0.5 for the old runs.
iou_threshold: 0.6

# which detection METHOD's output to read masks from (the method-name subfolder under the plot).
# default "yolo_sam_v1"; set "sahi_yolo_sam" to segment a SAHI detection run instead (Option C)
detection_method: "yolo_sam_v1"

# which mask-generation run (experiment folder) to read masks from — must match a folder in results/mask_generation/
# thesis_baseline = the shared end-to-end name: mask-gen writes it, seg reads it (keep the stages in sync)
mask_gen_experiment: "thesis_baseline"

# save colored overlay images showing which Gaussians were assigned to each head (useful for debugging)
save_vis_overlay: true

# only save overlays for the first N heads — 0 = save all (can generate 300+ images, slow for large plots)
vis_max_heads: 10

# pre-decode every SAM mask once into a compact tight-bbox crop cache (CPU RAM) instead of re-reading
# the full-res PNG per candidate in find_match — the big speedup on dense data, provably bit-identical
# to the old path. true = on (recommended). false = old decode-per-candidate baseline.
# (env WHEAT_SEG_NO_CACHE=1 also forces it off, e.g. for the A/B benchmark script.)
use_mask_cache: true

# fixed seed for the mask-processing order (random.shuffle of all_mask_paths). The seg outcome
# depends on processing order, so a fixed seed makes runs reproducible AND makes the crop-cache
# A/B a true apples-to-apples comparison (baseline vs cache process the same order).
seg_seed: 0

# frustum cull: skip rendering a head into cameras where its Gaussians don't project (per-Gaussian
# test). Provably bit-identical (verified lossless on 7 FIP plots + phone). BUT it barely helps on
# the capture geometries we have: FIP overhead + phone close-orbit both put every head in ~every
# view, so there's almost nothing to skip — and the per-head cull matmul made phone slightly SLOWER
# (5h41m off vs 5h56m on). The real seg speedups are the crop cache (FIP ~7×) and inference=True
# (phone ~2.7×), not the cull. So DEFAULT OFF. Turn it on (true) only for a capture where heads are
# genuinely local to a few views (a long linear sweep) — it's lossless either way. DEFAULT ON (thesis).
frustum_cull: true

# --- plot region of interest (ROI) for the 3D segmentation (phone; future-work quality fixes) ---
# Three INDEPENDENT filters (any combination); all DEFAULT OFF -> byte-identical to before. They need
# logs/marker_points3d.json in the plot's source folder; if the marker ring is incomplete they safely
# fall back to the old z<z_mean heuristic.
# roi_cull (F1, the ROI): cull every Gaussian whose HORIZONTAL position is outside the marker hull
#   (the same marker ring the 2D mask-generation ROI uses, applied here in 3D). Stops the ground/canopy
#   BEHIND the plot from being gathered into one large background blob. roi_buffer_m grows the hull
#   outward so plot-edge heads aren't clipped.
# height_band (separate vertical filter, NOT the ROI): also cull Gaussians outside a height band around
#   the marker plane (sky floaters / underground junk). Near a no-op on flat wheat plots.
# marker_exclude (F2): drop the Gaussians in a 3D sphere around each coded-marker — just the marker blob,
#   not a vertical column — so markers aren't segmented as heads while nearby heads are kept. The RECON-
#   STRUCTED marker is ~3x the physical plate (3DGS bakes plate + shadow + halo, measured ~0.20-0.25 u on
#   A/0715), so the old 0.075 only carved the core and the coloured rim leaked into neighbour heads.
#   PREFER marker_radius_rel: COLMAP units are arbitrary per session, so a fixed metre radius is unsafe
#   across sessions; a fraction of the median marker spacing tracks the real geometry (~0.065 -> ~0.20 u).
roi_cull: false
roi_buffer_m: 0.25
height_band: false
marker_exclude: false
marker_radius_m: 0.075        # absolute fallback (units = COLMAP world units); used only when marker_radius_rel = 0
marker_radius_rel: 0.0        # if >0, radius = this x median marker spacing (scale-free; 0.065 ~ 0.20 u on A/0715)

# The DEFAULT ground cull is a gentle, tilt-correct, scale-free cut that KEEPS HEADS WHOLE: when the plot
# has markers it fits the marker plane and culls only the bottom `ground_percentile` % of Gaussians by
# height above it (a thin below-ground slice). This replaces the old z<z_mean, which culled the lower HALF
# and — because phone heads sit at mid-height — bisected every head, causing partial heads, poor matching,
# and a crawling seg. On by default, independent of roi_cull. legacy_ground_cull=true forces the old
# z<z_mean (only to reproduce pre-fix runs). ground_percentile tunes how thin the below-ground slice is.
legacy_ground_cull: false
ground_percentile: 10.0
