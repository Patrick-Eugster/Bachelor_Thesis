# @package _global_
defaults:
  - /dataset: fip                       # override on CLI: dataset=phone
  - reconstruction: vanilla_3dgs        # override on CLI: reconstruction=2dgs
  - segmentation_3d: default            # override on CLI: segmentation_3d=tight
  - override /hydra/job_logging: disabled   # don't create a .log file in CWD — we print()
  - override /hydra/hydra_logging: disabled
  - _self_

# which plot folder to process (must exist inside dataset.input_dir)
plot: "plot_461"

# date subfolder for phone data — leave empty for FIP (no date subfolder)
# phone CLI: dataset=phone plot=field_A date=20250618
date: ""

# name for the 3DGS training output folder — "initial" is a safe scratch name (no overwrite warning)
# leave empty ("") for an auto timestamp: "2025-04-28_1430"
experiment_name: "initial"

# set true to prepend today's date to experiment_name: "2025-04-28_my_run" (ignored for "initial" or "")
prepend_date: false

# SAFETY: a named experiment that already exists on disk is REFUSED (hard error) so finished runs are
# never clobbered — in interactive AND non-interactive (SLURM) mode. Set true to overwrite on purpose.
# ("initial" scratch name and "" timestamps are exempt.)
allow_overwrite: false

# set true to use ground truth yolosam bboxes+masks instead of predicted ones (for ablation)
use_yolosam_source: false

# set true to use the supervisor's Agisoft SfM instead of our COLMAP cameras
# reads agisoft/images/ and agisoft/sparse/0/ from the plot folder instead of images/ and sparse/0/
# use_agisoft_sfm=true → experiment_name should differ from the COLMAP run so results don't collide
# only valid for phone plots (FIP has no agisoft/ subfolder)
use_agisoft_sfm: false

# SfM-source variant subfolder — "" = our COLMAP baseline (session root: images/ + sparse/0/).
# Set to a subfolder name to train/render/metrics on an alternative SfM under the session, e.g.
# sfm_variant=opencv reads opencv/images/ + opencv/sparse/0/ and writes results into a parallel
# opencv/ result subtree (so it never overwrites the baseline). Phone-only; "agisoft" is equivalent
# to use_agisoft_sfm=true. Each variant is its own result subtree, so experiment_name may repeat.
sfm_variant: ""

# pipeline step toggles (all off by default — enable on CLI or edit here)
run_train: false       # step 1: train 3DGS model
run_render: false      # step 2: render from training/test cameras (visual quality check)
run_metrics: false     # step 3: compute PSNR/SSIM/LPIPS on test views → results.json
run_seg: false         # step 4: assign 3D wheat head IDs to Gaussians (FlashSplat)
run_render_360: false  # step 5: render 360° flyaround video
run_eval: false        # step 6: evaluate 3D segmentation quality vs SAM masks (renders overlay PNGs)
run_eval_2d: false     # step 6b: pixel-level 2D metrics (IoU/P/R/F1) vs manual GT masks → eval_2d/metrics_2d.json
run_viewer: false      # step 7: open interactive viser viewer in browser

# render 360 settings
# bake HSV colors into Gaussians for fast rendering (1 render/frame instead of N_heads renders)
fast_render_360: true

# use white background for the 360° video
white_background_360: true

# number of frames in the 360° video
n_frames: 200

# output video framerate (fps)
framerate: 20

# camera elevation angle in degrees above the scene
elevation: 45

# 360° video resolution = training image / render_360_downscale (1 = full res, 2 = half [default])
render_360_downscale: 2
# orbit camera distance = scene_radius * render_360_distance_mult (higher = further out / less zoomed; 2.0 = old default)
render_360_distance_mult: 2.0

# viewer settings
# "full" = colored segmentation viewer (needs step 4 output), "single" = plain Gaussian viewer (works after step 1)
viewer_type: "full"

# bake HSV colors at startup for fast interactive rendering (~300 FlashSplat renders/frame otherwise makes it unusable)
fast_viewer: true

# browser port — open http://localhost:8080 after launching
viewer_port: 8080

# logging — pipeline output is written to seg_logs/{exp_name}.txt inside the experiment folder
# true = only log segmentation step (step 4) to file; training stays terminal-only since it's already verbose
log_seg_only: true

# wandb — set true to log training + segmentation progress to wandb.ai dashboard
# one-time setup: run 'wandb login' in terminal and paste API key from wandb.ai
# WARNING: set false on Euler (SLURM) unless wandb login has been run there first
wandb_enabled: false

# hydra: don't create outputs/ folder
hydra:
  output_subdir: null
  run:
    dir: .
