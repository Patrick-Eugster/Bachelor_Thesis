# @package _global_
# Config for src/preprocessing/apply_metric_transform.py — Level B / Flavour 1.
# Applies the Step-3 marker similarity transform to sparse/0 -> a metric sparse_metric/ model
# (local origin = survey centroid, so coords stay near 0 for 3DGS float32 safety). Reconstruction
# geometry unchanged; only gets real metres. Writes logs/metric_frame.json with the CH1903+ origin.
#
# Usage:
#   python src/preprocessing/apply_metric_transform.py field=field_A plot=20250609

defaults:
  - /dataset: phone
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

field: field_A
plot: ???

source_path: ${dataset.input_dir}/${field}/${plot}

sparse_dir: sparse/0                    # input COLMAP model (arbitrary scale)
output_dir: sparse_metric               # output metric model (real metres, local origin)
points_json: logs/marker_points3d.json  # our triangulated markers (from triangulate_markers.py)

# surveyed XYZ reference (gitignored demoanlage metadata, repo-root relative); <L> -> plot letter
survey_file: demoanlage2025_v0/metadata/markers/field_<L>_coordinates.txt

output_meta: logs/metric_frame.json

hydra:
  output_subdir: null
  run:
    dir: .
