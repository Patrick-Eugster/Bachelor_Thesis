# @package _global_
# Config for src/preprocessing/apply_metric_transform.py — Level B / Flavour 1.
# Applies the Step-3 marker similarity transform to sparse/0 -> a metric sparse_metric/ model
# (local origin = survey centroid, so coords stay near 0 for 3DGS float32 safety). Reconstruction
# geometry unchanged; only gets real metres. Writes logs/metric_frame.json with the CH1903+ origin.
#
# Usage:
#   python src/preprocessing/apply_metric_transform.py field=field_A plot=20250609

defaults:
  - /dataset: phone
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

field: field_A
plot: ???

source_path: ${dataset.input_dir}/${field}/${plot}

sparse_dir: sparse/0                    # input COLMAP model (arbitrary scale)
output_dir: sparse_metric               # output metric model (real metres, local origin)
points_json: logs/marker_points3d.json  # our triangulated markers (from triangulate_markers.py)

# WHERE the metric transform comes from (must match how marker_scale.py was run):
#   survey (default) = Umeyama onto surveyed XYZ → metric + georeferenced (needs the survey file).
#   tape             = SCALE only from tape distances → metric size, NOT georeferenced (needs the tape
#                      xlsx, no survey/GPS). R=identity, origin=marker centroid.
scale_source: survey

# surveyed XYZ reference (gitignored demoanlage metadata, repo-root relative); <L> -> plot letter
survey_file: demoanlage2025_v0/metadata/markers/field_<L>_coordinates.txt
# tape distances (only used when scale_source=tape); sheet 'plot <L>' inside this workbook
tape_xlsx: demoanlage2025_v0/metadata/markers/Demoanlage-2025-markers-manual-distances.xlsx

# --- marker quality guard (open item (a)) — MUST match marker_scale.yaml so the applied transform
# is anchored on exactly the markers the report trusted. See docs/MARKER_INTEGRATION_PLAN.md. ---
quality_min_parallax_deg: 10.0   # triangulation angle; < this = depth poorly constrained
quality_min_inlier_views: 4      # inlier views backing the 3D point
quality_max_reproj_px: 8.0       # max per-view reprojection error of the 3D point
quality_ratio_mad_k: 3.5         # tape mode: drop any pair whose ratio is > k MADs from median (0=off)

output_meta: logs/metric_frame.json

hydra:
  output_subdir: null
  run:
    dir: .
