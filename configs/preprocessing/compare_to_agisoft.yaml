# @package _global_
# Config for src/preprocessing/compare_to_agisoft.py — benchmarks our COLMAP sparse/
# against the supervisor's Agisoft-produced agisoft/sparse/ for the same plot.
# Typical usage:  python src/preprocessing/compare_to_agisoft.py field=field_A plot=20250715

defaults:
  - /dataset: phone
  - override /hydra/job_logging: disabled    # don't create a .log file in CWD — we print()
  - override /hydra/hydra_logging: disabled
  - _self_

field: field_A
plot: ???                                  # REQUIRED — e.g. 20250715

source_path: ${dataset.input_dir}/${field}/${plot}

# our COLMAP output (relative to source_path) — written by run_colmap.py
ours_sparse_dir: sparse/0

# Agisoft reference sparse (relative to source_path) — the ground truth
ref_sparse_dir: agisoft/sparse/0

# where the JSON report goes (relative to source_path)
output_file: logs/compare_to_agisoft.json

# include rotation comparison? (computes per-camera rotation error in degrees)
include_rotation: true

# --- extra comparisons (all opt-in, default on) ---
compare_intrinsics: true     # focal length (resolution-normalized f/W) + horizontal FOV, ours vs Agisoft
compare_points: true         # cloud-to-cloud nearest-neighbour (Chamfer) distance, ours vs Agisoft (mm)
compare_reproj: true         # reprojection error in px, recomputed the same way for BOTH (internal quality)
points_trim_pct: 5.0         # Chamfer: drop the worst N% of NN distances as outlier triangulations

# hydra: don't create outputs/ (we save our own log under {source_path}/logs/)
hydra:
  output_subdir: null
  run:
    dir: .
