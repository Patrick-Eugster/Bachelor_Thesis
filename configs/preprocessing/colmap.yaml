# @package _global_
# Config for src/preprocessing/run_colmap.py — runs COLMAP SfM on phone images.
# Typical usage:   python src/preprocessing/run_colmap.py plot=colmap_test_clean

defaults:
  - /dataset: phone           # phone-only workflow; pulls input_dir from configs/dataset/phone.yaml
  - override /hydra/job_logging: disabled    # don't create a .log file in CWD — we print()
  - override /hydra/hydra_logging: disabled
  - _self_

# field subfolder under {dataset.input_dir}/  (e.g. field_A, field_B, ...)
field: field_A

# plot name — the leaf folder under {dataset.input_dir}/{field}/. REQUIRED. Override on CLI: plot=...
plot: ???

# full path COLMAP reads from / writes to (auto-derived)
source_path: ${dataset.input_dir}/${field}/${plot}

# name of the subfolder inside source_path that contains the images COLMAP should read.
# Default "input_uniform" matches the typical phone workflow: run preprocess_uniform_size.py first,
# which produces input_uniform/ next to your original input/. Override to "input" for already-uniform data.
image_subdir: input_uniform

# where the COLMAP OUTPUTS (distorted/, images/, sparse/, logs/) are written, as a subfolder of
# source_path. Empty ("") = write directly into source_path (the baseline — byte-identical to before).
# Set e.g. variant_dir=sift to run an SfM-ablation variant (front-end / matcher / camera model) WITHOUT
# overwriting the baseline sparse/ — it lands in source_path/sift/{distorted,images,sparse/0,logs}. Input
# images are always read from source_path/image_subdir, so all variants share the same input. Compare a
# variant with:   compare_to_agisoft ours_sparse_dir=<variant_dir>/sparse/0   (e.g. sift/sparse/0)
variant_dir: ""

# force COLMAP to treat all images as one shared camera (one set of intrinsics for everything).
# Only valid when all images have identical dimensions — run preprocess_uniform_size.py first.
# Helps prevent the mapper splitting the reconstruction by intrinsic group on phone data.
# Set false if your images really come from different cameras (mixed phones / lenses).
single_camera: true

# COLMAP camera model
# SIMPLE_PINHOLE — single focal length, no distortion
# PINHOLE        — two focal lengths (fx, fy), no distortion
# SIMPLE_RADIAL  — adds 1 radial distortion param (k1)
# OPENCV         — full radial + tangential (k1,k2,p1,p2) (DEFAULT)
# WHY OPENCV is the default: our phone lens has real distortion (k1~0.05, ~50-60px at the extreme corner).
# Under ALIKED+LightGlue every camera model registers 93/93 on wheat (the old "PINHOLE/OPENCV collapse to
# 2/93" was a SIFT-era result, now obsolete — the strong learned matches easily constrain the extra params
# SIFT couldn't). OPENCV is marginally the most correct by the Agisoft-INDEPENDENT metric — internal
# reprojection error 1.323 -> 1.263 px. It costs a little more time and CROPS the undistorted image slightly
# (4032->3881), which misaligns our hand-labeled GT masks, so eval_2d is validated pinhole-only — but that
# only affects OUR GT scoring, not a new user's run. SIMPLE_PINHOLE is the lighter, crop-free fallback if you
# don't want to model distortion. Full write-up: docs/PHONE_SFM_CAMERA_MODEL.md.
camera: OPENCV

# feature front-end: "aliked" (learned ALIKED detector + LightGlue learned matcher, DEFAULT) or "sift"
# (classic). ALIKED closes the SIFT fragmentation gap on repetitive wheat: field_A/20250603 SIFT = 4
# sub-models / largest 76-of-113, ALIKED = ONE model / 113-of-113 (denser than Agisoft). ALIKED needs GPU +
# CUDA-12 onnxruntime libs (see aliked_cuda12_libdir). Set front_end=sift for the classic SIFT path. See
# docs/PHONE_SFM_FRONTEND.md for the full benchmark.
front_end: aliked

# feature matcher: "exhaustive" (all-pairs — default) or "sequential" (ordered walk/video, matches each
# frame to its time-neighbours only). DEFAULT FLIPPED to exhaustive 2026-06-28 for POSE ACCURACY:
# sequential and exhaustive give the same REGISTRATION (1 model, 100%), but a single linear walk has no
# loop closure, so sequential accumulates DRIFT — the sweep endpoints wander (field_D/20250722 ends were
# ~85-99mm off Agisoft, middle ~15mm). Exhaustive's all-pairs matching supplies the missing long-range
# cross-links that close the open walk: across 14 sessions it cut median camera-pose error vs Agisoft
# (e.g. field_A/20250618 51->10mm, field_A/20250603 111->49mm), halved typical rotation error, and
# tightened the marker tape-scale (field_A/20250618 27->1.1mm; 13/14 sessions now reliable metric).
# COST: exhaustive is O(N^2) — ~5min@64img, ~14min@113img, ~34min@183img. For LARGE sets (170+, e.g. the
# lisa sessions) prefer sequential with a higher sequential_overlap (or add loop detection) to dodge the
# N^2 blow-up. Use sequential for UNORDERED sets too. See docs/PHONE_SFM_POSE_ACCURACY.md.
matcher: exhaustive

# sequential only — how many next images each image is matched against (also matches symmetrically backwards)
sequential_overlap: 25

# --- ALIKED front-end options (only used when front_end=aliked) ---
# features per image. Higher = denser model but more VRAM; 4096 is a good default, 2048 for headroom.
aliked_max_num_features: 4096
# downscale the image FOR FEATURE DETECTION ONLY (px, longest side) — caps extraction VRAM. ALIKED is a
# dense CNN whose VRAM scales with pixel count: ~15.7 GB at full 12 MP (OOMs a 16 GB card unless it's
# nearly empty). **This does NOT downscale your output images** — image_undistorter re-reads the
# originals and writes images/ at FULL resolution (verified 4032×3024); only the keypoint detection for
# pose estimation runs at reduced res (standard "High" alignment, like Agisoft). VRAM is BIMODAL (the
# ONNX arena reserves in power-of-two chunks): ≤1664→~9 GB, ≥1728→~15 GB — no stable middle.
# Default 2048 (~15 GB peak — completed 13/13 sessions, all 100 % registered in one model). Drop to 1600
# (~10 GB) if you need more VRAM headroom / the GPU is shared. 0 = full res (only safe on an empty GPU).
aliked_max_image_size: 2048
# SIFT extraction downscale (front_end=sift only). 0 = COLMAP default (3200 px), byte-identical to the
# original SIFT behavior. Set 2048 to MATCH the ALIKED front-end's downscale for a resolution-fair A1
# comparison (otherwise SIFT extracts at 3200 while ALIKED runs at 2048 — a confound, though it favors ALIKED).
sift_max_image_size: 0
# CPU threads for ALIKED extraction (image decode + pre/post-proc). COLMAP's own pool ignores OMP env,
# so cap it here to avoid pinning all cores during the ~45s extraction. -1 = all cores.
aliked_extract_threads: 4
# directory holding the CUDA-12 onnxruntime libs (cublas/cudart/cudnn/cufft), prepended to
# LD_LIBRARY_PATH so COLMAP's CUDA-12-built ONNX provider loads on a CUDA-13 box. "" = leave
# LD_LIBRARY_PATH untouched (set this empty if the system CUDA already matches, e.g. Euler). Create once:
#   pip install --target <dir> nvidia-cublas-cu12 nvidia-cuda-runtime-cu12 nvidia-cudnn-cu12 nvidia-cufft-cu12
# Default points at the PERSISTENT in-repo copy (tools/cuda12libs, ~2.5 GB, gitignored) so ALIKED keeps
# working across sessions — replaces the old ephemeral scratchpad path that every run used to reference.
# Set "" on a box whose system CUDA already matches (e.g. Euler).
aliked_cuda12_libdir: /workspace/tools/cuda12libs

# threads for SIFT extraction + matching. Lower = less RAM (default 8, set -1 for all cores)
num_threads: 8

# force CPU SIFT (only set true if your COLMAP install lacks CUDA — we built ours with CUDA support)
no_gpu: false

# skip steps 1-3 (feature extraction, matching, mapper) — only run image_undistorter on existing distorted/sparse/0
skip_matching: false

# ROUTE 2 (opt-in): inject decoded marker tie-points into database.db between matcher and mapper, so
# the second SfM bakes markers in (survey-free). "" = off (normal run). Set to the detections JSON
# (relative to the session) produced by detect_markers_v8_cct.py with image_subdir=input_uniform —
# the markers MUST be in the same image space the feature_extractor used. See inject_markers_to_db.py.
inject_markers_json: ""

# also create downscaled images_2/, images_4/, images_8/ for multi-resolution training (needs ImageMagick)
resize: false

# also write sparse/0/{cameras,images,points3D}.txt alongside the .bin files (human-readable,
# useful for diffing vs Agisoft's text export). The .bin files stay the canonical input for 3DGS.
export_text: true

# explicit COLMAP binary path (leave empty to use `colmap` on PATH)
colmap_executable: ""

# explicit ImageMagick binary path (leave empty to use `magick` on PATH) — only used when resize=true
magick_executable: ""

# hydra: don't create outputs/ folder (we save our own log + config snapshot under {source_path}/logs/)
hydra:
  output_subdir: null
  run:
    dir: .
