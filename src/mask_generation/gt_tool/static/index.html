<meta charset="utf-8">
<title>Wheat Point-GT tool</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1e1e1e; color: #ddd;
         overflow: hidden; height: 100vh; display: flex; font-size: 15px; }
  #side { width: 240px; flex: none; background: #252526; border-right: 1px solid #333;
          display: flex; flex-direction: column; height: 100vh; }
  #side.collapsed { display: none; }
  #topbars button { flex: none; background: #333; color: #ddd; border: 1px solid #555;
            border-radius: 4px; cursor: pointer; font-size: 14px; padding: 3px 10px; }
  #topbars button:hover { background: #454545; }
  #roiBtn.on, #maskBtn.on, #selBtn.on { background: #0e639c; border-color: #1177bb; color: #fff; }
  #editBtn.on { background: #b5432e; border-color: #d4623e; color: #fff; }   /* edit mode = red */
  .ic { width: 15px; height: 15px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; }
  /* custom tooltips (native title delay is too long / not adjustable) — show after 0.5s */
  #topbars button[data-tip] { position: relative; }
  #topbars button[data-tip]::after {
    content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 0;
    background: #0d0d0d; color: #eee; border: 1px solid #666; border-radius: 4px;
    padding: 4px 9px; font-size: 12px; font-weight: 400; white-space: nowrap; z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity .12s; transition-delay: 0s; }
  #topbars button[data-tip]:hover::after { opacity: 1; transition-delay: .5s; }
  #lockBtn.on { background: #b8860b; border-color: #d7ba7d; color: #fff; }
  #hideBtn.on { background: #6a4a9c; border-color: #8a6abb; color: #fff; }
  #runBtn { background: #2d7d2d; border-color: #3a9a3a; color: #fff; }
  #runBtn:hover { background: #369036; }
  #ptModeBtn.remove { background: #9c3a3a; border-color: #bb5555; color: #fff; }
  #side h2 { font-size: 15px; margin: 10px; color: #9cdcfe; }
  #list { overflow-y: auto; flex: 1; }
  .session { padding: 7px 10px; font-size: 14px; font-weight: 600; color: #9cdcfe;
             background: #2d2d30; border-top: 3px solid #454545; }
  .session:first-child { border-top: none; }
  .session .cnt { float: right; font-weight: 400; color: #888; }
  .item { padding: 6px 10px 6px 22px; font-size: 14px; cursor: pointer;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccc; }
  .item small { font-size: 1em; }
  .item:hover { background: #2a2d2e; }
  .item.active { background: #094771; color: #fff; }
  .item .done { color: #4ec9b0; }
  .item .draft { color: #d7ba7d; }
  .item .dot { color: #666; }
  #main { flex: 1; position: relative; }
  canvas { display: block; background: #111; cursor: crosshair; }
  #topbars { position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
  #bar, #bar2 { padding: 7px 10px; font-size: 14px; background: rgba(30,30,30,.92);
         border-bottom: 1px solid #333; display: flex; align-items: center; }
  #bar { gap: 16px; }
  #bar2 { gap: 10px; }
  .sep { width: 1px; height: 20px; background: #555; margin: 0 6px; }
  #bar b { color: #dcdcaa; }
  #busy { color: #f48771; display: none; }
  #help { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 8px;
          background: rgba(30,30,30,.94); border-top: 1px solid #333;
          display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { background: #333640; border: 1px solid #4d515c; border-radius: 4px; padding: 2px 8px;
          font-size: 12px; color: #d6d6d6; white-space: nowrap; }
  .chip b { color: #e6c877; font-weight: 700; margin-right: 5px; }
  .mode-NEW { color: #4ec9b0; } .mode-EDIT { color: #dcdcaa; }
</style>

<div id="side">
  <h2>GT images</h2>
  <div id="list">loading…</div>
</div>
<div id="main">
  <canvas id="cv"></canvas>
  <div id="topbars">
    <div id="bar">
      <button id="toggle" title="show/hide sidebar (B)">☰</button>
      <span id="s_img">— no image —</span>
      <span>instances: <b id="s_n">0</b></span>
      <span>sel: <b id="s_sel">none</b></span>
      <span>mode: <b id="s_mode" class="mode-SELECT">SELECT</b></span>
      <span id="s_dirty" style="color:#f48771"></span>
      <span id="busy">⏳ SAM…</span>
    </div>
    <div id="bar2">
      <button id="selBtn" class="on" title="select mode — clicks pick a mask (Esc)">↖ Select</button>
      <button id="editBtn" title="edit selected mask — clicks place points (E)">✎ Edit</button>
      <button id="ptModeBtn" title="what a click places: add / remove point">＋ point</button>
      <button id="runBtn" title="run SAM on the placed points (Enter)">▶ Run SAM</button>
      <span class="sep"></span>
      <button id="maskBtn" class="on" title="show/hide the mask overlay (M)">👁 masks</button>
      <button id="hideBtn" title="hide all masks except locked (H)">👁 hide all</button>
      <button id="lockBtn" title="lock/unlock selected mask (L)">🔒 lock</button>
      <button id="roiBtn" title="toggle ROI border (R)">▦ ROI</button>
    </div>
  </div>
  <div id="help">
    <span class="chip"><b>L-click</b>select</span>
    <span class="chip"><b>E</b>edit</span>
    <span class="chip"><b>Q</b>swap ＋∕−</span>
    <span class="chip"><b>Shift-click</b>＋point</span>
    <span class="chip"><b>Alt-click</b>−point</span>
    <span class="chip"><b>Enter</b>Run SAM</span>
    <span class="chip"><b>N</b>new head</span>
    <span class="chip"><b>Del</b>delete</span>
    <span class="chip"><b>Ctrl+Z</b>undo pt</span>
    <span class="chip"><b>Ctrl+S</b>save</span>
    <span class="chip"><b>L</b>lock</span>
    <span class="chip"><b>X</b>hide sel</span>
    <span class="chip"><b>M</b>masks</span>
    <span class="chip"><b>H</b>hide all</span>
    <span class="chip"><b>R</b>ROI</span>
    <span class="chip"><b>right-drag / wheel / WASD</b>pan</span>
    <span class="chip"><b>Alt+wheel</b>zoom</span>
    <span class="chip"><b>, / .</b>prev / next</span>
  </div>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
// eye / eye-off SVG icons (Feather) for the show/hide buttons
const EYE = `<svg class="ic" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYEOFF = `<svg class="ic" viewBox="0 0 24 24"><path d="M17.9 17.9A10 10 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-6M9.9 4.2A9 9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2m-6.7-1.1a3 3 0 1 1-4.2-4.2"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
// colored point cursor for edit mode (green + for add, red − for remove)
function cursorURL(add){
  // small reticle with an OPEN CENTER so the target pixel stays visible.
  // add = green 4-tick crosshair (＋); remove = two solid red pills (−), fully black-bordered.
  let shapes;
  if(add){
    const ticks = "M13 4v4 M13 18v4 M4 13h4 M18 13h4";
    shapes = `<path d='${ticks}' stroke='#000' stroke-width='4' fill='none' stroke-linecap='round'/>`
           + `<path d='${ticks}' stroke='#33ff33' stroke-width='1.8' fill='none' stroke-linecap='round'/>`;
  } else {
    shapes = `<rect x='1.5' y='10.5' width='7.5' height='5' rx='2.5' fill='#ff2020' stroke='#000' stroke-width='1.5'/>`
           + `<rect x='17' y='10.5' width='7.5' height='5' rx='2.5' fill='#ff2020' stroke='#000' stroke-width='1.5'/>`;
  }
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26'>${shapes}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}") 13 13, crosshair`;
}
function updateCursor(){
  if(spaceDown){ cv.style.cursor = 'grab'; return; }
  cv.style.cursor = editing ? cursorURL(!!pointMode) : 'default';
}
let img = new Image(), overlay = new Image();
let meta = null, scale = 1, offX = 0, offY = 0;
let selectedId = null, newMode = false, localPoints = [], spaceDown = false, shiftDown = false;
let editing = false, pointMode = 1;  // editing = clicks place points; pointMode 1=add / 0=remove
let hoverIdx = -1;                    // index of the placed point under the cursor (remove mode)
let listItems = [], curIdx = -1;
let dirty = false;   // unsaved changes since last load/save -> warn before leaving
let roiPoly = null, roiOn = false;   // ROI marker-hull polygon overlay
let overlayVisible = true;           // masks button: show/hide the whole overlay (client-side)
let hideAll = false;                 // hide-all button: server hides all but locked

// native "unsaved changes" prompt on tab close (browsers only allow their generic dialog, no custom Save button)
window.addEventListener('beforeunload', (ev)=>{
  if(dirty){ ev.preventDefault(); ev.returnValue = ''; }
});
function markDirty(){ dirty = true; setStatus(); }

function resize(){ cv.width = document.getElementById('main').clientWidth; cv.height = window.innerHeight; draw(); }
window.addEventListener('resize', resize);

function toggleSidebar(){
  const s = document.getElementById('side');
  s.classList.toggle('collapsed');
  resize();                                    // canvas grows/shrinks to fill the freed space
}
document.getElementById('toggle').onclick = toggleSidebar;

// smooth WASD pan: run an animation loop while keys are held (not OS key-repeat, which jumps)
const panKeys = {w:false, a:false, s:false, d:false};
let panRAF = null;
function panLoop(){
  const SPEED = shiftDown ? 10 : 4;            // 4 px/frame normal, 10 with Shift held
  if(panKeys.w) offY += SPEED;
  if(panKeys.s) offY -= SPEED;
  if(panKeys.a) offX += SPEED;
  if(panKeys.d) offX -= SPEED;
  draw();
  panRAF = (panKeys.w||panKeys.a||panKeys.s||panKeys.d) ? requestAnimationFrame(panLoop) : null;
}

function toggleRoi(){
  if(!meta){ return; }                         // no image loaded -> ignore silently
  if(!roiPoly){ alert('No ROI for this image (markers missing / not all triangulated).'); return; }
  roiOn = !roiOn;
  document.getElementById('roiBtn').classList.toggle('on', roiOn);
  draw();
}
document.getElementById('roiBtn').onclick = toggleRoi;

function toggleMasks(){                         // masks button: show/hide the whole overlay (client-side)
  overlayVisible = !overlayVisible;
  setStatus(); draw();
}
document.getElementById('maskBtn').onclick = toggleMasks;

function toggleHideAll(){                       // hide-all button: server hides all but locked
  hideAll = !hideAll;
  setStatus(); refreshOverlay();
}
document.getElementById('hideBtn').onclick = toggleHideAll;

function setSelectMode(){                       // Select button / Esc: clicks pick a mask
  editing = false; setStatus(); draw();
}
document.getElementById('selBtn').onclick = setSelectMode;

function toggleEdit(){                          // Edit button / E: clicks place points (pick a mask on 1st click)
  editing = !editing;
  if(editing) pointMode = 1;                    // entering edit always starts in ADD-point mode
  setStatus(); draw();
}
document.getElementById('editBtn').onclick = toggleEdit;

function togglePointMode(){ pointMode = pointMode ? 0 : 1; setStatus(); }
document.getElementById('ptModeBtn').onclick = togglePointMode;
document.getElementById('runBtn').onclick = runSam;

function updateLockBtn(locked){
  const b = document.getElementById('lockBtn');
  b.classList.toggle('on', !!locked);
  b.textContent = locked ? '🔓 unlock' : '🔒 lock';
}

async function flagSelected(key){              // toggle hidden/locked on the selected instance
  if(!selectedId){ return; }
  const j = await post('/api/flag', {id:selectedId, key});
  if(key === 'locked') updateLockBtn(j.locked);
  refreshOverlay();
}
document.getElementById('lockBtn').onclick = ()=>flagSelected('locked');

function busy(on, msg){ const b = document.getElementById('busy');
  b.style.display = on ? 'inline' : 'none'; b.textContent = msg || '⏳ SAM…'; }
function setStatus(){
  document.getElementById('s_img').textContent = meta ? `${meta.field}/${meta.date}/${meta.stem}` : '— no image —';
  document.getElementById('s_n').textContent = meta ? meta.n : 0;
  document.getElementById('s_sel').textContent = selectedId ? `#${selectedId} (${localPoints.length}pt)` : 'none';
  const m = newMode ? 'NEW' : (editing ? ('EDIT ' + (pointMode ? '＋' : '−')) : 'SELECT');
  const el = document.getElementById('s_mode'); el.textContent = m;
  el.className = 'mode-' + (newMode ? 'NEW' : editing ? 'EDIT' : 'SELECT');
  document.getElementById('s_dirty').textContent = dirty ? '● unsaved' : '';
  // mode button group
  document.getElementById('editBtn').classList.toggle('on', editing);
  document.getElementById('selBtn').classList.toggle('on', !editing && !newMode);
  const pm = document.getElementById('ptModeBtn');
  pm.textContent = pointMode ? '＋ point' : '− point';
  pm.classList.toggle('remove', !pointMode);
  // dynamic show/hide toggle buttons (eye / eye-with-slash icon)
  const mb = document.getElementById('maskBtn');
  mb.innerHTML = (overlayVisible ? EYE : EYEOFF) + ' masks';
  mb.classList.toggle('on', overlayVisible);
  const hb = document.getElementById('hideBtn');
  hb.innerHTML = (hideAll ? EYEOFF : EYE) + (hideAll ? ' show all' : ' hide all');
  hb.classList.toggle('on', hideAll);
  updateCursor();
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,offX,offY);
  if(img.complete && img.naturalWidth){ ctx.drawImage(img,0,0); }
  if(overlayVisible && overlay.complete && overlay.naturalWidth){ ctx.drawImage(overlay,0,0); }
  // ROI overlay (toggle): darken everything OUTSIDE the plot + dashed border on the edge
  if(roiOn && roiPoly && roiPoly.length){
    // 1. darken outside: fill (whole image) with the ROI polygon as an even-odd hole
    ctx.beginPath();
    ctx.rect(0, 0, meta.w, meta.h);
    ctx.moveTo(roiPoly[0][0], roiPoly[0][1]);
    for(let i=1;i<roiPoly.length;i++) ctx.lineTo(roiPoly[i][0], roiPoly[i][1]);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fill('evenodd');
    // 2. dashed border on the ROI edge
    ctx.beginPath();
    ctx.moveTo(roiPoly[0][0], roiPoly[0][1]);
    for(let i=1;i<roiPoly.length;i++) ctx.lineTo(roiPoly[i][0], roiPoly[i][1]);
    ctx.closePath();
    ctx.lineWidth = 3/scale; ctx.strokeStyle = '#00e5ff';
    ctx.setLineDash([14/scale, 9/scale]); ctx.stroke(); ctx.setLineDash([]);
  }
  // point markers only while editing (keeps SELECT view clean)
  if(editing) for(let i=0; i<localPoints.length; i++){
    const p = localPoints[i], hov = (i === hoverIdx && !pointMode);
    if(hov){                                         // glow ring: this point will be deleted on click
      ctx.beginPath(); ctx.arc(p.x, p.y, 9/scale, 0, 7);
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2/scale; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, (hov?7:5)/scale, 0, 7);
    ctx.fillStyle = p.l ? '#33dd33' : '#ff4444';
    ctx.strokeStyle = hov ? '#fff' : '#000'; ctx.lineWidth = (hov?2.5:1.5)/scale;
    ctx.fill(); ctx.stroke();
  }
}

function refreshOverlay(){
  if(!meta) return;
  overlay.onload = draw;
  overlay.src = `/api/overlay?sel=${selectedId==null?'null':selectedId}&hideall=${hideAll?1:0}&t=${Date.now()}`;
}

function fitView(){
  const pad = 40;
  scale = Math.min((cv.width-pad)/meta.w, (cv.height-pad)/meta.h);
  offX = (cv.width - meta.w*scale)/2; offY = (cv.height - meta.h*scale)/2;
}

async function loadImage(idx){
  const it = listItems[idx]; if(!it) return;
  if(dirty && !confirm('You have unsaved changes on this image.\nDiscard them and switch?')) return;
  curIdx = idx; selectedId = null; newMode = false; editing = false; localPoints = []; dirty = false;
  renderList();
  // 1. load the image only (fast) -> show it immediately
  const r = await fetch('/api/load', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({field:it.field, date:it.date, stem:it.stem})});
  meta = await r.json();
  roiPoly = meta.roi;                                      // marker-hull polygon (or null if unavailable)
  document.getElementById('roiBtn').classList.toggle('on', roiOn && !!roiPoly);
  img.onload = ()=>{ fitView(); draw(); };
  img.src = `/image?field=${it.field}&date=${it.date}&stem=${it.stem}`;
  refreshOverlay(); setStatus();
  // 2. seed ONLY if this image was never decoded before; a cached draft/saved GT comes back instantly
  if(meta.cached){ return; }
  busy(true, `⏳ seeding ${meta.nboxes} heads (first time only)…`);
  const s = await (await fetch('/api/seed', {method:'POST', headers:{'Content-Type':'application/json'},
            body: '{}'})).json();
  listItems[idx].cached = true;                            // now cached -> next open is instant
  if(curIdx === idx){ meta.n = s.n; busy(false); refreshOverlay(); setStatus(); renderList(); }
}

// screen -> image coords
function toImg(ev){
  const rect = cv.getBoundingClientRect();
  return { x: (ev.clientX - rect.left - offX)/scale, y: (ev.clientY - rect.top - offY)/scale };
}

async function post(url, body){
  busy(true);
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json(); busy(false); return j;
}

// ---- point placing (accumulate; SAM runs only on Run) ----
function addPoint(p, label){
  if(!selectedId) return;
  editing = true;
  localPoints.push({x:p.x, y:p.y, l:label});
  markDirty(); setStatus(); draw();
}
async function newInstance(){                        // start a fresh empty head, ready for points
  const j = await post('/api/new', {});
  selectedId = j.id; newMode = false; editing = true; pointMode = 1; localPoints = [];
  updateLockBtn(false); markDirty(); setStatus(); draw();
}
async function runSam(){                             // commit placed points -> SAM once, back to select
  if(!selectedId || !localPoints.length) return;
  await post('/api/set_points', {id:selectedId, points: localPoints.map(p=>[p.x,p.y,p.l])});
  editing = false;                                   // committed -> leave edit so clicks select again
  markDirty(); refreshOverlay(); setStatus(); draw();
}

// ---- mouse ----
let panning = false, panStart = null;
async function selectAt(p){                        // pick the mask under the cursor + load its points
  const j = await post('/api/select', {x:p.x, y:p.y});
  selectedId = j.id;
  localPoints = (j.points||[]).map(q=>({x:q[0], y:q[1], l:q[2]}));
  updateLockBtn(j.locked); refreshOverlay(); setStatus();
}
cv.addEventListener('mousedown', async (ev)=>{
  if(spaceDown || ev.button === 2){                 // right-button OR Space = pan drag (works in any mode)
    panning = true; panStart = {x:ev.clientX-offX, y:ev.clientY-offY}; cv.style.cursor='grabbing'; return; }
  if(!meta) return;
  const p = toImg(ev);
  if(newMode){ await newInstance(); return; }
  if(ev.shiftKey){ if(!selectedId) await selectAt(p); addPoint(p, 1); return; }  // Shift+click = add point
  if(ev.altKey){ if(!selectedId) await selectAt(p); addPoint(p, 0); return; }    // Alt+click   = remove point
  if(editing){                                      // EDIT: click places a point (auto-selects the mask if none yet)
    if(!pointMode && hoverIdx !== -1){              // remove mode + hovering a point -> delete THAT point
      localPoints.splice(hoverIdx, 1); hoverIdx = -1; markDirty(); setStatus(); draw(); return;
    }
    if(!selectedId){ await selectAt(p); if(!selectedId) return; }  // clicked a mask -> select it, then place
    addPoint(p, pointMode); return;
  }
  await selectAt(p);                                // SELECT (default): never adds a point
});
cv.addEventListener('contextmenu', (ev)=> ev.preventDefault());   // no menu; right-drag pans instead
window.addEventListener('mousemove', (ev)=>{
  if(panning){ offX = ev.clientX - panStart.x; offY = ev.clientY - panStart.y; draw(); return; }
  // in remove mode, highlight the placed point under the cursor (it'll be deleted on click)
  let idx = -1;
  if(editing && !pointMode && localPoints.length){
    const p = toImg(ev), thr = 11/scale; let best = thr;
    for(let i=0;i<localPoints.length;i++){
      const d = Math.hypot(localPoints[i].x-p.x, localPoints[i].y-p.y);
      if(d < best){ best = d; idx = i; }
    }
  }
  if(idx !== hoverIdx){ hoverIdx = idx; draw(); }
});
window.addEventListener('mouseup', ()=>{ if(panning){ panning = false; updateCursor(); } });

// ---- wheel: pan / zoom ----
cv.addEventListener('wheel', (ev)=>{
  ev.preventDefault();
  if(ev.altKey || ev.ctrlKey){                       // zoom to cursor
    const rect = cv.getBoundingClientRect();
    const mx = ev.clientX-rect.left, my = ev.clientY-rect.top;
    const f = ev.deltaY < 0 ? 1.15 : 1/1.15;
    const ix = (mx-offX)/scale, iy = (my-offY)/scale;
    scale *= f; offX = mx - ix*scale; offY = my - iy*scale;
  } else if(ev.shiftKey){ offX -= ev.deltaY; }        // horizontal pan
  else { offY -= ev.deltaY; offX -= ev.deltaX; }      // vertical (+ trackpad X)
  draw();
}, {passive:false});

// ---- keyboard ----
window.addEventListener('keydown', async (ev)=>{
  shiftDown = ev.shiftKey;                        // keep Shift state current for the WASD speed boost
  if(ev.code === 'Space'){ spaceDown = true; cv.style.cursor='grab'; ev.preventDefault(); return; }
  if(ev.key === 'b' || ev.key === 'B'){ toggleSidebar(); return; }
  if(ev.key === 'r' || ev.key === 'R'){ toggleRoi(); return; }
  if(ev.key === 'h' || ev.key === 'H'){ toggleHideAll(); return; }
  if(ev.key === 'm' || ev.key === 'M'){ toggleMasks(); return; }
  if(ev.key === 'e' || ev.key === 'E'){ toggleEdit(); return; }
  if((ev.key === 'q' || ev.key === 'Q') && editing){ togglePointMode(); draw(); return; }  // swap add/remove
  if(ev.key === 'Enter'){ ev.preventDefault(); runSam(); return; }
  if((ev.key === 'x' || ev.key === 'X') && selectedId){ flagSelected('hidden'); return; }
  if((ev.key === 'l' || ev.key === 'L') && selectedId){ flagSelected('locked'); return; }
  if(ev.key === 'Escape'){
    if(editing){ editing = false; }                            // 1st Esc leaves edit (keeps selection)
    else { selectedId = null; localPoints = []; updateLockBtn(false); refreshOverlay(); }
    setStatus(); draw(); return; }
  if((ev.key === 'n' || ev.key === 'N')){ newMode = !newMode; setStatus(); return; }
  if(ev.key === 'Delete' && selectedId){
    await post('/api/delete', {id:selectedId});
    selectedId=null; editing=false; localPoints=[]; updateLockBtn(false); markDirty(); refreshOverlay(); setStatus(); return; }
  if(ev.ctrlKey && (ev.key === 'z' || ev.key === 'Z') && editing){   // undo last placed point (before Run)
    ev.preventDefault();
    localPoints.pop(); setStatus(); draw(); return; }
  if(ev.ctrlKey && ev.key === 's'){
    ev.preventDefault(); busy(true);
    const j = await post('/api/save', {}); busy(false);
    dirty = false; listItems[curIdx].done = true; renderList();
    alert(`saved ${j.count} heads →\n${j.path}`); setStatus(); return; }
  if(ev.key === ','){ if(curIdx>0) loadImage(curIdx-1); return; }
  if(ev.key === '.'){ if(curIdx<listItems.length-1) loadImage(curIdx+1); return; }
  if(ev.key === '+' || ev.key === '='){ scale*=1.15; draw(); return; }
  if(ev.key === '-'){ scale/=1.15; draw(); return; }
  if(!ev.ctrlKey && !ev.altKey && (ev.key.toLowerCase() in panKeys)){  // smooth WASD pan
    panKeys[ev.key.toLowerCase()] = true;
    if(!panRAF) panLoop();
    return;
  }
});
window.addEventListener('keyup', (ev)=>{
  shiftDown = ev.shiftKey;
  if(ev.code==='Space'){ spaceDown=false; updateCursor(); }
  const k = ev.key.toLowerCase();
  if(k in panKeys) panKeys[k] = false;
});

// ---- image list ----
function renderList(){
  const el = document.getElementById('list'); el.innerHTML = '';
  let lastSession = null;
  listItems.forEach((it, i)=>{
    const session = `${it.field}/${it.date}`;
    if(session !== lastSession){                         // session header + divider, groups its 3 images
      const frames = listItems.filter(x=>`${x.field}/${x.date}` === session);
      const done = frames.filter(x=>x.done).length;
      const h = document.createElement('div'); h.className = 'session';
      h.innerHTML = `${session}<span class="cnt">${done}/${frames.length}</span>`;
      el.appendChild(h); lastSession = session;
    }
    const mark = it.done ? '<span class="done">✔</span>'          // saved GT
               : it.cached ? '<span class="draft">◐</span>'        // seeded draft cached (fast reopen)
               : '<span class="dot">•</span>';                     // never opened
    const d = document.createElement('div'); d.className = 'item' + (i===curIdx?' active':'');
    d.innerHTML = `${mark} <small>${it.stem}</small>`;
    d.onclick = ()=>loadImage(i); el.appendChild(d);
  });
}
async function init(){
  // move button title -> data-tip so our fast custom tooltip shows instead of the slow native one
  document.querySelectorAll('#topbars button[title]').forEach(b=>{
    b.dataset.tip = b.getAttribute('title'); b.removeAttribute('title'); });
  resize();
  listItems = await (await fetch('/api/list')).json();
  renderList();
}
init();
</script>
