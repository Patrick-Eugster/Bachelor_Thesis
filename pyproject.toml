[project]
name = "wheat3dgs"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    # BASE deps — installed in EVERY env (the torch-2.1.2 "recon" env AND the modern "maskgen" env).
    # MUST stay compatible with torch 2.1.2 (the compiled CUDA submodules + gsplat are built against
    # that exact ABI). Do NOT add anything here that forces a torch upgrade. In particular SAHI is NOT
    # here — it lives in the [maskgen] extra below (see the comment there for why it must stay separate).
    "numpy<2",   # torch 2.1.2 / gsplat / cv2 are compiled against NumPy 1.x. NumPy 2.x breaks torch's numpy bridge (_ARRAY_API not found). Pin keeps pip from bumping it. (Also fine in the maskgen env — sahi/yolo/sam all work on NumPy 1.x.)
    "opencv-python<4.12",   # opencv-python >=4.12 dropped NumPy-1.x wheels (requires numpy>=2) — conflicts with the numpy<2 pin above. Cap below 4.12.
    "scikit-image",
    "openpyxl",   # pure-Python .xlsx reader (no torch coupling) — reads the FIP wheat_head_counts.xlsx GT (src/segmentation_3d/headcount_gt.py)
    "hydra-core",   # all orchestrators are @hydra.main — needed in every env (pure-Python, no torch coupling)
    "omegaconf",    # config objects passed around the pipeline (pulled by hydra-core too, listed for clarity)
]

# Per-env extras. torch itself is intentionally NOT declared anywhere — each env installs its own torch
# out-of-band (conda / the pytorch wheel index) matched to its CUDA, and pip leaves it alone as long as
# the already-installed version satisfies the floors below.
[project.optional-dependencies]
# MASK-GENERATION env ONLY (torch>=2.4). NEVER `pip install -e ".[maskgen]"` into the torch-2.1.2
# recon/seg env: sahi forces torch>=2.4.1, which uninstalls 2.1.2 → breaks every compiled CUDA
# extension (undefined symbol _ZN2at4_ops5zeros...). This env compiles NOTHING (no submodules), so a
# self-contained prebuilt torch wheel is all it needs. Install order: torch>=2.4 FIRST, then this.
maskgen = [
    "sahi",                 # SAHI tiled inference (the phone mask-gen default) — needs torch>=2.4.1
    "segment-anything",     # SAM ViT-H: `from segment_anything import sam_model_registry`. If the PyPI build misbehaves, install from git: pip install git+https://github.com/facebookresearch/segment-anything.git
    "wandb",                # hard top-level import in sam_v1_pipelined.py (loaded even when wandb_enabled=false)
    # vendored yolov5 (src/mask_generation/yolov5) runtime libs — torch/torchvision come from the env, not here:
    "ultralytics==8.4.21",  # pinned: matches the local-proven env. 8.4.82's GitRepo.__init__ reads .git/commondir at import → crashes on Euler's unreadable shared /cluster/home/.git; 8.4.21's __init__ never reads inside .git (only .is_repo/.root are used).
    "pandas>=1.1.4",
    "seaborn>=0.11.0",
    "thop>=0.1.1",
    "gitpython>=3.1.30",
    "psutil",
    "matplotlib>=3.3",
    "requests>=2.32.2",
    "tqdm>=4.66.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
