[project]
name = "wheat3dgs"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "scikit-image",
    "sahi",   # tiled inference: slicing + NMM/IOS merge for the sahi_yolo_sam detector
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
